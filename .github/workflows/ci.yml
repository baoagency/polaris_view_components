name: CI

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.2", "3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: StandardRb check
        run: bundle exec standardrb

      - name: Run Herb Linter
        run: pnpm herb:lint

      - name: Run tests
        run: bundle exec rake

  view-component-compatibility:
    name: ViewComponent ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum (3.0.0)
            ruby-version: "3.2"
            rails-version: "~> 7.1.0"
            view-component-version: "= 3.0.0"
          - name: latest 4.x
            ruby-version: "4.0"
            rails-version: "~> 8.1"
            view-component-version: "< 5.0"
    env:
      BUNDLE_GEMFILE: gemfiles/view_component.gemfile
      POLARIS_RAILS_VERSION: ${{ matrix.rails-version }}
      POLARIS_VIEW_COMPONENT_VERSION: ${{ matrix.view-component-version }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve compatibility dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Run tests
        run: bundle exec rake
